[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-store-manager"
version = "0.1.0"
description = "Telegram bot and Mini App for managing a fashion store catalog"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.25,<4.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "redis>=5.2,<6.0",
    "pydantic-settings>=2.6,<3.0",
    "structlog>=24.4,<26.0",
    "python-dotenv>=1.0,<2.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
    "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
